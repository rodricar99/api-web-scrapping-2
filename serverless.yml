org: TU_ORG
service: igp-sismos-scraping

provider:
  name: aws
  runtime: python3.12
  # Memoria por defecto de las funciones (1024MB)
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::606646193182:role/LabRole

functions:
  scrape_sismos:
    handler: scrap_table.lambda_handler  # El nombre del archivo y la función deben coincidir
    package:
      include:
        - ./**  # Incluir todo el contenido del directorio
    events:
      - http:
          path: /scrape/sismos
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
